name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Secret scan
        run: |
          if grep -rE "(sk-ant-[a-zA-Z0-9_\-]{20,}|PAYPAL_CLIENT_SECRET=[a-zA-Z0-9_\-]{20,})" --include="*.js" --include="*.json" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "Potential secret found in committed files"
            exit 1
          fi
          echo "Secret scan passed"
