services:
  - type: web
    name: realm
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
